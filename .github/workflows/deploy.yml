name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site (web/ -> dist/)
        run: |
          mkdir -p dist
          cp web/index.html dist/index.html
          cp web/main.js dist/main.js
          cp web/spaces.json dist/spaces.json
          cp web/building_opt.glb dist/building_opt.glb
          cp -r web/vendor dist/vendor
          find dist -type f -size +25M -print -exec false {} + || { echo "::error::file exceeds Cloudflare Pages 25 MiB limit"; exit 1; }
          ls -la dist
          du -sh dist

      - name: Skip deploy (Cloudflare secrets not set yet)
        if: env.HAS_CF_SECRETS != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured - build OK, deploy skipped."

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gothic-ruins --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
